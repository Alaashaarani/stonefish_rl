  # - [2.0, 1.0, 0.0, 0.0, 1.0, 5.0, 5.0]

# Maps to train.total_timesteps in the generated training YAML.
# max_iteration: 3000000
eval_freq: 1200 # Vector steps: 60000 samples with the base config's 50 workers.
max_iteration:
#   - 1500000
  # - 1500000
  # - 5000000
  - 2500000
